name: Weekly review reminders
# Calls the app's protected endpoint once a week. Free: GitHub's included Actions minutes cover a one-second job.
# Needs two repository secrets (Settings -> Secrets and variables -> Actions): CRON_SECRET (same value as the Vercel env var) and REMINDER_URL
# (https://tradenotes.dev/api/cron/review-reminders). Scheduled workflows only run from the default branch. See docs/REVIEW_REMINDERS.md.
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  send:
    name: send weekly review reminders
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the reminder endpoint
        env:
          REMINDER_URL: ${{ secrets.REMINDER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$REMINDER_URL" ] || [ -z "$CRON_SECRET" ]; then echo "REMINDER_URL / CRON_SECRET not set: nothing sent"; exit 1; fi
          curl -sS --fail-with-body -X POST -H "Authorization: Bearer $CRON_SECRET" --max-time 120 "$REMINDER_URL"
          echo
