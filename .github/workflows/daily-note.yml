name: Daily note
# Calls the app's protected endpoint once a day (12:00 UTC = 07:00 in Jamaica). Free: GitHub's included Actions minutes cover a one-second job.
# Needs two repository secrets: CRON_SECRET (same value as the Vercel env var) and DAILY_NOTE_URL (https://tradenotes.dev/api/cron/daily-note).
# Scheduled workflows only run from the default branch. The note itself comes from src/content/notes.ts: no note for today means nothing is sent.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  send:
    name: send today's note
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the daily note endpoint
        env:
          DAILY_NOTE_URL: ${{ secrets.DAILY_NOTE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DAILY_NOTE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "DAILY_NOTE_URL / CRON_SECRET not set: nothing sent"; exit 1; fi
          curl -sS --fail-with-body -X POST -H "Authorization: Bearer $CRON_SECRET" --max-time 120 "$DAILY_NOTE_URL"
          echo
